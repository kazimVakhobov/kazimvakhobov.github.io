name: pages

# Сайт собирается из master и уезжает на GitHub Pages. Работа идёт в dev,
# в master она попадает через PR — поэтому деплой висит на master, а не на
# каждом пуше.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages этим доказывает, какой workflow собрал сайт

# Одна выкладка за раз, и более новый пуш отменяет ещё летящий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
